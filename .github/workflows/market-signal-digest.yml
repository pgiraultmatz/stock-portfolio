name: Market Signal Digest

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Signal timeframe to check
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - both
      daily_ema_threshold:
        description: Maximum close distance from daily EMA, in percent
        required: true
        default: "1.5"
      weekly_ema_threshold:
        description: Maximum close distance from weekly EMA, in percent
        required: true
        default: "3.0"
  schedule:
    - cron: "0 20 * * 1-5"

env:
  GO_VERSION: '1.25.x'

jobs:
  market-signal-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set run metadata
        id: meta
        run: |
          TIMEFRAME="${{ inputs.timeframe || 'both' }}"
          DAILY_EMA_THRESHOLD="${{ inputs.daily_ema_threshold || '1.5' }}"
          WEEKLY_EMA_THRESHOLD="${{ inputs.weekly_ema_threshold || '3.0' }}"
          TODAY="$(date +'%Y-%m-%d')"
          echo "TODAY=$TODAY" >> $GITHUB_OUTPUT
          echo "TIMEFRAME=$TIMEFRAME" >> $GITHUB_OUTPUT
          echo "DAILY_EMA_THRESHOLD=$DAILY_EMA_THRESHOLD" >> $GITHUB_OUTPUT
          echo "WEEKLY_EMA_THRESHOLD=$WEEKLY_EMA_THRESHOLD" >> $GITHUB_OUTPUT
          if [ "$TIMEFRAME" = "weekly" ]; then
            echo "OUTPUT_FILE=market-signals-weekly.html" >> $GITHUB_OUTPUT
          elif [ "$TIMEFRAME" = "both" ]; then
            echo "OUTPUT_FILE=market-signals.html" >> $GITHUB_OUTPUT
          else
            echo "OUTPUT_FILE=market-signals.html" >> $GITHUB_OUTPUT
          fi

      - name: Build application
        run: go build -o stock-checker ./cmd/stock-checker

      - name: Check market signals
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./stock-checker -config config.json -check-market-digest -market-digest-timeframe ${{ steps.meta.outputs.TIMEFRAME }} -market-digest-ema-threshold ${{ steps.meta.outputs.DAILY_EMA_THRESHOLD }} -market-digest-weekly-ema-threshold ${{ steps.meta.outputs.WEEKLY_EMA_THRESHOLD }} -market-digest-output ${{ steps.meta.outputs.OUTPUT_FILE }} -verbose

      - name: Check report
        id: report
        run: |
          if [ -f "${{ steps.meta.outputs.OUTPUT_FILE }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Send digest email
        if: steps.report.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Market Signal Digest - ${{ steps.meta.outputs.TODAY }}"
          html_body: file://${{ steps.meta.outputs.OUTPUT_FILE }}
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: Stock Analyzer <${{ secrets.EMAIL_USERNAME }}>
          secure: true

      - name: Upload digest artifact
        if: steps.report.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-signal-digest-${{ steps.meta.outputs.TIMEFRAME }}-${{ steps.meta.outputs.TODAY }}-${{ github.run_number }}
          path: ${{ steps.meta.outputs.OUTPUT_FILE }}
          retention-days: 7
