name: Market Signal Digest

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Signal timeframe to check
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
      ema_threshold:
        description: Maximum close distance from EMA, in percent
        required: true
        default: "1.5"
  schedule:
    - cron: "0 20 * * 1-5"

env:
  GO_VERSION: '1.25.x'

jobs:
  market-signal-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set run metadata
        id: meta
        run: |
          TIMEFRAME="${{ inputs.timeframe || 'daily' }}"
          EMA_THRESHOLD="${{ inputs.ema_threshold || '1.5' }}"
          TODAY="$(date +'%Y-%m-%d')"
          echo "TODAY=$TODAY" >> $GITHUB_OUTPUT
          echo "TIMEFRAME=$TIMEFRAME" >> $GITHUB_OUTPUT
          echo "EMA_THRESHOLD=$EMA_THRESHOLD" >> $GITHUB_OUTPUT
          if [ "$TIMEFRAME" = "weekly" ]; then
            echo "DIVERGENCES_STATE=.divergence-weekly-state.json" >> $GITHUB_OUTPUT
            echo "TECHNICAL_STATE=.technical-weekly-state.json" >> $GITHUB_OUTPUT
            echo "OUTPUT_FILE=market-signals-weekly.html" >> $GITHUB_OUTPUT
            echo "CACHE_PREFIX=weekly-market-signal-digest" >> $GITHUB_OUTPUT
            echo "CACHE_SCOPE=$(date +'%G-W%V')" >> $GITHUB_OUTPUT
            echo "SUBJECT_LABEL=Weekly Market Signal Digest" >> $GITHUB_OUTPUT
          else
            echo "DIVERGENCES_STATE=.divergence-state.json" >> $GITHUB_OUTPUT
            echo "TECHNICAL_STATE=.technical-state.json" >> $GITHUB_OUTPUT
            echo "OUTPUT_FILE=market-signals.html" >> $GITHUB_OUTPUT
            echo "CACHE_PREFIX=market-signal-digest" >> $GITHUB_OUTPUT
            echo "CACHE_SCOPE=$TODAY" >> $GITHUB_OUTPUT
            echo "SUBJECT_LABEL=Market Signal Digest" >> $GITHUB_OUTPUT
          fi

      - name: Restore digest state
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.meta.outputs.DIVERGENCES_STATE }}
            ${{ steps.meta.outputs.TECHNICAL_STATE }}
          key: ${{ steps.meta.outputs.CACHE_PREFIX }}-${{ steps.meta.outputs.CACHE_SCOPE }}-${{ github.run_number }}
          restore-keys: ${{ steps.meta.outputs.CACHE_PREFIX }}-${{ steps.meta.outputs.CACHE_SCOPE }}-

      - name: Build application
        run: go build -o stock-checker ./cmd/stock-checker

      - name: Check market signals
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./stock-checker -config config.json -check-market-digest -market-digest-timeframe ${{ steps.meta.outputs.TIMEFRAME }} -market-digest-ema-threshold ${{ steps.meta.outputs.EMA_THRESHOLD }} -market-digest-output ${{ steps.meta.outputs.OUTPUT_FILE }} -market-digest-divergences-state ${{ steps.meta.outputs.DIVERGENCES_STATE }} -market-digest-technical-state ${{ steps.meta.outputs.TECHNICAL_STATE }} -verbose

      - name: Save digest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.meta.outputs.DIVERGENCES_STATE }}
            ${{ steps.meta.outputs.TECHNICAL_STATE }}
          key: ${{ steps.meta.outputs.CACHE_PREFIX }}-${{ steps.meta.outputs.CACHE_SCOPE }}-${{ github.run_number }}

      - name: Check report
        id: report
        run: |
          if [ -f "${{ steps.meta.outputs.OUTPUT_FILE }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Send digest email
        if: steps.report.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.meta.outputs.SUBJECT_LABEL }} — ${{ steps.meta.outputs.TODAY }}"
          html_body: file://${{ steps.meta.outputs.OUTPUT_FILE }}
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: Stock Analyzer <${{ secrets.EMAIL_USERNAME }}>
          secure: true

      - name: Upload digest artifact
        if: steps.report.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.CACHE_PREFIX }}-${{ steps.meta.outputs.CACHE_SCOPE }}-${{ github.run_number }}
          path: ${{ steps.meta.outputs.OUTPUT_FILE }}
          retention-days: 7
